[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadence"
version = "0.1.0"
description = "Cadence — self-hosted, single-user personal attention & context guardian"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Cadence" }]
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "uvicorn[standard]>=0.50.2",
    # Authenticated encryption (AES-256-GCM) for the NAS credential vault; also the
    # RSA JWT signer for live FCM push (the fcm extra reuses this core dependency).
    "cryptography>=42",
]

[project.scripts]
# A single `cadence` executable with subcommands (cadence runtime | devbox | onboarding),
# so the systemd units invoke `cadence runtime` / `cadence devbox` from the venv's bin/.
cadence = "cadence.cli:main"

# Runtime feature extras (opt-in via `uv sync --extra fcm` / `pip install cadence[fcm]`).
[project.optional-dependencies]
# Live FCM push delivery (RSA JWT signer for the service-account access token).
# cryptography is already a core dependency; kept here so the fcm extra stays
# self-documenting about what it needs.
fcm = [
    "cryptography>=42",
]

# Dev tooling (PEP 735 dependency group; installed by `uv sync` by default).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "jsonschema>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["cadence"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".omc", ".omx", ".remember", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4"]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.isort]
known-first-party = ["cadence"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning:cadence.*",
]
