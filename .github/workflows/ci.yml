name: CI

# Build, lint and test every part of Cadence: the Python brain, the Rust
# capture core, and the two device agents (Android on Linux, the Windows
# agent on a real Windows runner — the only place net8.0-windows/WPF builds).
#
# Supply-chain posture: every third-party action is pinned to a full commit
# SHA (the `# vX.Y.Z` comment is informational only). Bump deliberately.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Brain — Python lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          enable-cache: true
      - name: Sync (locked; provisions the pinned Python)
        run: uv sync --locked
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest

  rust-core:
    name: Agent core — Rust fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/core
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          # rust-cache keys off the workspace Cargo.lock automatically.
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (deny warnings, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test

  android:
    name: Android agent — native core + assembleDebug
    runs-on: ubuntu-latest
    env:
      # Keep in step with agents/android/README.md (cargo-ndk 4.1.2 panics on r27,
      # so we cross-compile with the NDK clang wrappers directly).
      NDK_VERSION: "27.0.12077973"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install NDK r27
        run: sdkmanager --install "ndk;${NDK_VERSION}"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Cross-compile agent-core to jniLibs (per ABI)
        working-directory: agents/core
        run: |
          set -euo pipefail
          BIN="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          out="$GITHUB_WORKSPACE/agents/android/app/src/main/jniLibs"
          build() { # $1=rust-triple  $2=clang-wrapper  $3=android-abi
            env "CC_$1=$BIN/$2" "AR_$1=$BIN/llvm-ar" \
                "CARGO_TARGET_$(echo "$1" | tr 'a-z-' 'A-Z_')_LINKER=$BIN/$2" \
                cargo build --release --target "$1" --features jni
            mkdir -p "$out/$3"
            cp "target/$1/release/libcadence_agent_core.so" "$out/$3/"
          }
          build aarch64-linux-android     aarch64-linux-android24-clang    arm64-v8a
          build armv7-linux-androideabi   armv7a-linux-androideabi24-clang armeabi-v7a
          build x86_64-linux-android      x86_64-linux-android24-clang     x86_64
      - name: Gradle assembleDebug
        working-directory: agents/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-android-debug-apk
          path: agents/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows-agent:
    name: Windows agent — build + publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore agents/windows/CadenceWindowsAgent.csproj
      - name: Build (Release)
        run: dotnet build agents/windows/CadenceWindowsAgent.csproj -c Release --no-restore
      - name: Publish (framework-dependent)
        run: dotnet publish agents/windows/CadenceWindowsAgent.csproj -c Release --no-build -o publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cadence-windows-agent
          path: publish/
          if-no-files-found: error
