[package]
name = "cadence-agent-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Portable, crash-safe capture core for Cadence device agents (WAL, dedupe, backpressure, mTLS transport)."
license = "AGPL-3.0-or-later"
publish = false

# A `cdylib` is emitted so the Android (JNI) and Windows (P/Invoke) agents can bind
# to the same core via FFI; `rlib` keeps it usable as a normal Rust dependency/test target.
[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["https"]
# The reqwest/rustls mTLS transport. Tests do not need it (they use MockTransport),
# but it is on by default so `cargo build/clippy/test` all lint the real transport.
https = ["dep:reqwest"]
# The JNI export layer (`src/jni.rs`) for the Android agent. Off by default so the
# default `cargo build` (Windows P/Invoke path) does not pull the `jni` crate.
jni = ["dep:jni"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
jni = { version = "0.21", optional = true }

[dev-dependencies]
tempfile = "3"
# --- M8 feasibility spike (delegated-signer mTLS) dev-deps -------------------
# Named directly so the spike test can build a rustls ClientConfig/ServerConfig
# and a custom SigningKey/Signer. Pinned to the SAME rustls 0.23 reqwest already
# pulls (Cargo.lock: rustls 0.23.41) with the `ring` provider — NOT aws-lc-rs —
# so `use_preconfigured_tls` accepts the config (exact-version downcast) and no
# heavy C toolchain is dragged in. rcgen mints an in-memory test CA + certs;
# `ring` performs the actual P-256 signature inside the "hardware" closure.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
# Pinned to 0.14.7: 0.14.8 bumps its own MSRV to rustc 1.88, above this crate's
# declared rust-version 1.75. (Dev-dep only — never in a downstream consumer's build.)
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "crypto"] }
